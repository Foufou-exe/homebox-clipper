# Development HomeBox instance for testing homebox-clipper.
# Guide : docs/local-homebox.md
name: homebox-clipper-dev

services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:${HOMEBOX_VERSION:-latest}
    container_name: homebox
    restart: unless-stopped
    ports:
      # Listens on all interfaces: http://localhost:3100 and http://<host-IP>:3100
      - "${HOMEBOX_PORT:-3100}:7745"
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Required (>= 32 bytes) and stable: changing it invalidates all issued API keys.
      HBOX_AUTH_API_KEY_PEPPER: ${HBOX_AUTH_API_KEY_PEPPER:?Set HBOX_AUTH_API_KEY_PEPPER in .env (see docs/local-homebox.md)}
    volumes:
      # SQLite database and attachments, inside the repo (ignored by git: /homebox/).
      - ./homebox:/data
