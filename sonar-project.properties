sonar.projectKey=Foufou-exe_homebox-clipper
sonar.organization=foufou-exe

# This is the name and version displayed in the SonarQube UI.
sonar.projectName=homebox-clipper

# Source code and tests. Test fixtures (saved HTML pages) are not analysed.
sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=tests/fixtures/**,**/*.html,public/**,.output/**,.wxt/**,node_modules/**,specs/**
sonar.test.exclusions=tests/fixtures/**,**/*.html

sonar.sourceEncoding=UTF-8

# Coverage: produced by `bun run test:coverage` (Vitest, V8) before the scan in the workflow.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Only the generated project tsconfig covers the sources; test fixtures contain deliberately broken tsconfig files.
sonar.typescript.tsconfigPaths=.wxt/tsconfig.json
