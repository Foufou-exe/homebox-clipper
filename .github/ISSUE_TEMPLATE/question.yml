name: Question or help
description: Ask how to use or set up the extension
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Troubleshooting and FAQ](https://github.com/Foufou-exe/homebox-clipper/wiki/Troubleshooting-and-FAQ) page first. For questions about HomeBox itself, see the [HomeBox documentation](https://homebox.software).

        Never attach raw store pages, API keys, real instance addresses (public or local) or personal data.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried?
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Visible in `chrome://extensions`.
      placeholder: "0.2.0"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read the FAQ and searched the existing issues.
          required: true
        - label: I removed any personal data, API key and real instance address from this question.
          required: true
