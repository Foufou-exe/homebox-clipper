name: Misdetected merchant page
description: A field (product, price, date, invoice…) is missing or wrong on a supported merchant site
labels: ["merchant: detection", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what the extension detected versus what the page shows. Type the values by hand: do not paste the page source.

        Never attach raw store pages, API keys, real instance addresses (public or local) or personal data.
  - type: input
    id: merchant-domain
    attributes:
      label: Merchant and domain
      placeholder: "Amazon, amazon.fr"
    validations:
      required: true
  - type: dropdown
    id: site-language
    attributes:
      label: Language of the merchant site
      options: [Français, English, Deutsch, Español, Italiano, Other]
    validations:
      required: true
  - type: dropdown
    id: fields
    attributes:
      label: Affected field(s)
      multiple: true
      options: [Product name, Price, Currency, Date, Order number, Seller, Quantity, Image, Invoice, Other]
    validations:
      required: true
  - type: dropdown
    id: order-type
    attributes:
      label: Order type
      multiple: true
      options: [Sold by the merchant, Third-party seller, Multiple items, Multiple shipments, Digital order, Other]
    validations:
      required: true
  - type: textarea
    id: observed-expected
    attributes:
      label: What is detected / what was expected
      description: 'Use placeholders instead of real values if they are personal (e.g. "order number 123-XXXXXXX").'
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Visible in `chrome://extensions`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed any personal data (name, address, order numbers) from this report.
          required: true
