name: Misdetected merchant page
description: A field (product, price, date, invoice…) is missing or wrongly detected on a merchant site
labels: ["merchant: detection"]
body:
  - type: markdown
    attributes:
      value: "Never attach raw store pages, API keys, real instance addresses (public or local) or personal data."
  - type: input
    id: marchand-domaine
    attributes:
      label: Merchant / domain
      placeholder: "Merchant name and domain (e.g. example.com)"
    validations:
      required: true
  - type: dropdown
    id: champs
    attributes:
      label: Affected field(s)
      multiple: true
      options: [Product name, Price, Currency, Date, Order number, Seller, Quantity, Image, Invoice, Other]
    validations:
      required: true
  - type: dropdown
    id: type-commande
    attributes:
      label: Order type
      multiple: true
      options: [Sold by the merchant, Third-party seller, Multiple items, Multiple shipments, Digital order, Other]
    validations:
      required: true
  - type: textarea
    id: constat
    attributes:
      label: What is shown / what was expected
  - type: input
    id: version-extension
    attributes:
      label: Extension version
      placeholder: "0.1.0 (chrome://extensions)"
    validations:
      required: true
