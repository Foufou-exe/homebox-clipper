name: Request a new merchant
description: Suggest support for a merchant site
labels: ["merchant: request"]
body:
  - type: markdown
    attributes:
      value: "Never attach raw store pages, API keys, real instance addresses (public or local) or personal data."
  - type: input
    id: nom-marchand
    attributes:
      label: Merchant name
    validations:
      required: true
  - type: input
    id: domaines
    attributes:
      label: Domain(s)
      placeholder: "e.g. example.com, example.de"
    validations:
      required: true
  - type: input
    id: pays
    attributes:
      label: Country
    validations:
      required: true
  - type: dropdown
    id: factures
    attributes:
      label: Does the site offer downloadable invoices?
      options: [Yes, No, I don't know]
    validations:
      required: true
  - type: textarea
    id: remarques
    attributes:
      label: Notes
