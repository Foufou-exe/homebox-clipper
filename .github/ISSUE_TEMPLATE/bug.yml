name: Signaler un bug
description: Un comportement incorrect de l'extension
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Ne joignez jamais de page brute d'un site marchand, de clé API, d'adresse réelle d'instance (publique ou locale) ni de donnée personnelle."
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: attendu-obtenu
    attributes:
      label: Résultat attendu / obtenu (message d'erreur exact)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Extension 0.1.0, HomeBox v0.27.0, Chrome 140"
    validations:
      required: true
