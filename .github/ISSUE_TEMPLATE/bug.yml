name: Report a bug
description: Incorrect behavior of the extension
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Never attach raw store pages, API keys, real instance addresses (public or local) or personal data."
  - type: textarea
    id: etapes
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: attendu-obtenu
    attributes:
      label: Expected / actual result (exact error message)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Extension 0.1.0, HomeBox v0.27.0, Chrome 140"
    validations:
      required: true
