name: Report a bug
description: The extension does not behave as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!

        Before submitting, please check the [Troubleshooting and FAQ](https://github.com/Foufou-exe/homebox-clipper/wiki/Troubleshooting-and-FAQ) page: your problem may already have an answer.

        Never attach raw store pages, API keys, real instance addresses (public or local) or personal data.
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Visible in `chrome://extensions`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Name and version (see `chrome://version`).
      placeholder: "Chrome 140, Brave 1.80, Edge 140…"
    validations:
      required: true
  - type: input
    id: homebox-version
    attributes:
      label: HomeBox version
      description: Shown in the HomeBox footer or its status page.
      placeholder: "v0.27.0"
    validations:
      required: true
  - type: dropdown
    id: ui-language
    attributes:
      label: Interface language
      description: Language of the extension interface when the problem happened.
      options: [English, Français, Other]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options: [Popup, Options page, Import, Photo, Location, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected / actual result
      description: What you expected, what happened instead (exact error message if any).
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots (with personal data blurred), console messages, merchant and order type.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed any personal data, API key and real instance address from this report.
          required: true
